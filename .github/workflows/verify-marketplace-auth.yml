name: Verify Marketplace Authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.24.0

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show Marketplace identity
        run: |
          az rest \
            --method get \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query '{id:id,displayName:displayName}'

      - name: Verify publisher access
        run: pnpm exec vsce verify-pat tttpob --azure-credential
